<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>

    <!-- 24K Wafer Gold Metallic Bevel -->
    <linearGradient id="icon-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Cleanroom Argon Laser Cyan -->
    <linearGradient id="icon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Die Core Gradient -->
    <linearGradient id="icon-die" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070d1e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- High-Contrast Text Gradient -->
    <linearGradient id="icon-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Canvas Container (Squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#icon-bg)"/>
  
  <!-- Outer Tech Border with subtle cyan and gold sheen -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#icon-gold)" stroke-width="5" stroke-opacity="0.6"/>
  <rect width="492" height="492" x="10" y="10" rx="106" fill="none" stroke="url(#icon-cyan)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Wafer Outer Alignment Disc & Laser Ring -->
  <circle cx="256" cy="256" r="196" fill="#040914" stroke="url(#icon-gold)" stroke-width="14"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#icon-cyan)" stroke-width="3.5" stroke-dasharray="14 10" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#1e293b" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Wafer Flat / Orientation Notch Indicator (Semiconductor Standard) -->
  <path d="M 230 60 L 282 60 L 274 80 L 238 80 Z" fill="url(#icon-gold)" filter="url(#icon-glow)"/>

  <!-- Glowing Laser Axis Crosshairs / Alignment Reticle -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="url(#icon-cyan)" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="10 8"/>
  <line x1="256" y1="60" x2="256" y2="452" stroke="url(#icon-cyan)" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="10 8"/>

  <!-- Silicon Die Gold Leads / Connection Pins (16 pins) -->
  <g fill="url(#icon-gold)">
    <!-- Top Pins -->
    <rect x="200" y="132" width="14" height="28" rx="4"/>
    <rect x="232" y="132" width="14" height="28" rx="4"/>
    <rect x="266" y="132" width="14" height="28" rx="4"/>
    <rect x="298" y="132" width="14" height="28" rx="4"/>
    <!-- Bottom Pins -->
    <rect x="200" y="352" width="14" height="28" rx="4"/>
    <rect x="232" y="352" width="14" height="28" rx="4"/>
    <rect x="266" y="352" width="14" height="28" rx="4"/>
    <rect x="298" y="352" width="14" height="28" rx="4"/>
    <!-- Left Pins -->
    <rect x="132" y="200" width="28" height="14" rx="4"/>
    <rect x="132" y="232" width="28" height="14" rx="4"/>
    <rect x="132" y="266" width="28" height="14" rx="4"/>
    <rect x="132" y="298" width="28" height="14" rx="4"/>
    <!-- Right Pins -->
    <rect x="352" y="200" width="28" height="14" rx="4"/>
    <rect x="352" y="232" width="28" height="14" rx="4"/>
    <rect x="352" y="266" width="28" height="14" rx="4"/>
    <rect x="352" y="298" width="28" height="14" rx="4"/>
  </g>

  <!-- Central Silicon Microchip Die (High-Contrast Core) -->
  <rect x="156" y="156" width="200" height="200" rx="42" fill="url(#icon-die)" stroke="url(#icon-gold)" stroke-width="10" filter="url(#icon-glow)"/>
  <rect x="168" y="168" width="176" height="176" rx="32" fill="none" stroke="url(#icon-cyan)" stroke-width="3" stroke-opacity="0.85"/>

  <!-- Four Precision Corner Fiducial Circuit Nodes -->
  <circle cx="188" cy="188" r="7.5" fill="#38bdf8"/>
  <circle cx="324" cy="188" r="7.5" fill="#38bdf8"/>
  <circle cx="188" cy="324" r="7.5" fill="#38bdf8"/>
  <circle cx="324" cy="324" r="7.5" fill="#fbbf24"/>

  <!-- Ultra High-Legibility Bold FSE Brand Identity -->
  <text x="256" y="278"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="86"
        font-weight="900"
        fill="url(#icon-text)"
        text-anchor="middle"
        letter-spacing="-2.5">FSE</text>

  <!-- Micro "STUDIO" High-Tech Badge -->
  <text x="256" y="318"
        font-family="system-ui, -apple-system, monospace"
        font-size="20"
        font-weight="900"
        fill="#38bdf8"
        text-anchor="middle"
        letter-spacing="7">STUDIO</text>
</svg>
